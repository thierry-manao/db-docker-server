name: Deploy to servers

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DEPLOY_BRANCH: main

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server: ${{ fromJson(vars.DEPLOY_SERVERS) }}
    steps:
      - name: Trigger deploy on ${{ matrix.server }}
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"username":"${{ secrets.DBSERVER_USER }}","password":"${{ secrets.DBSERVER_PASSWORD }}","branch":"${{ env.DEPLOY_BRANCH }}"}' \
            "https://${{ matrix.server }}:${{ vars.UI_PORT || 8888 }}/api/webhook/deploy" \
            --max-time 120)
          if [ "$RESPONSE" = "200" ]; then
            echo "✅ Deploy triggered on ${{ matrix.server }}"
          else
            echo "❌ Failed on ${{ matrix.server }} (HTTP $RESPONSE)"
            exit 1
          fi
