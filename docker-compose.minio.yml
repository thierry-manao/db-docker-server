services:
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    ports:
      - "${MINIO_API_PORT:-9002}:9000"
      - "${MINIO_CONSOLE_PORT:-9003}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "${DBSERVER_PG_PORT:-5480}:5432"
    environment:
      POSTGRES_DB: dbserver
      POSTGRES_USER: ${DBSERVER_PG_USER:-dbserver}
      POSTGRES_PASSWORD: ${DBSERVER_PG_PASSWORD:-dbserver}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DBSERVER_PG_USER:-dbserver}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  minio-data:
  pg-data:
